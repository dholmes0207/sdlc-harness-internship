[project]
name = "product-search-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
